[[bin]]
name = "inbound"
path = "fuzz_targets/inbound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot"
path = "fuzz_targets/snapshot.rs"
test = false
doc = false
bench = false

[workspace]
