[package]
name = "tessera-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false
description = "Tessera client cryptography: orchestration of OpenMLS (RFC 9420) and Ed25519. No custom primitives."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versions are pinned exactly: any change to this list needs cryptography review (docs/crypto-design.md).
openmls = "=0.9.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_traits = "=0.6.0"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
sha2 = "=0.11.1"
subtle = "2.6"
# Backups (docs/encrypted-backups.md): versions already used by the OpenMLS provider.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "stream"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
zeroize = { version = "1.9", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Errors are returned as values. wasm32 traps on panic; the worker then discards the instance
# and reloads from the last persisted snapshot (crypto-design §11).
