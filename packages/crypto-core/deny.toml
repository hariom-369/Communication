# cargo-deny policy for the crypto core (security review F-06; docs/security.md §10).
# CI runs `cargo deny check` (advisories need the RustSec database, fetched there); locally
# `cargo deny check licenses bans sources` works offline once the index is cached.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included; an exception needs an
# entry here with the advisory id and the reason, reviewed like code.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
  # proc-macro-error2: unmaintained, no vulnerability. A compile-time helper of hax-lib-macros,
  # reached through libcrux-sha3 → hpke-rs → openmls_rust_crypto; no code of it is in the
  # shipped WASM. No maintained version exists; remove when OpenMLS's crypto stack drops it.
  # Reviewed 2026-10-16.
  # crypto-bigint 0.5 (timing variability): reached only through elliptic-curve 0.13 for P-256 and
  # P-384 (p256/p384 via openmls_rust_crypto, hpke-rs-rust-crypto, openmls_basic_credential). The
  # core uses ciphersuite 0x0001 only (X25519, Ed25519) and refuses key packages and groups of any
  # other suite (client.rs: key_package.ciphersuite(), group.ciphersuite()), so no P-256/P-384
  # operation runs. The fix (0.7.6) needs elliptic-curve 0.14, which OpenMLS 0.6 does not use;
  # remove when it does. Reviewed 2026-10-26.
  { id = "RUSTSEC-2026-0387", reason = "P-256/P-384 only; ciphersuite 0x0001 enforced, those curves never execute; fix needs an OpenMLS major update" },
  { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time proc-macro helper via openmls_rust_crypto; no runtime code, no upgrade available" },
]

[licenses]
version = 2
# Permissive licenses and MPL-2.0 (file-level copyleft, compatible with shipping the WASM build).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crate (publish = false) is not a dependency.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
# Cryptography comes from the audited stacks the design names (crypto-design.md); these would
# be a second, unreviewed implementation of the same primitives.
deny = [
  { crate = "openssl", reason = "RustCrypto and OpenMLS's providers only (crypto-design.md)" },
  { crate = "openssl-sys", reason = "RustCrypto and OpenMLS's providers only (crypto-design.md)" },
  { crate = "ring", reason = "one implementation per primitive; RustCrypto is the one in use" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
