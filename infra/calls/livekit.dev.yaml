# LiveKit SFU for local development and end-to-end tests only (ADR-017). Production settings
# (TLS, public IPs, port ranges, Redis for multi-node) live in the deployment, not here.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
# Media is end-to-end encrypted (SFrame); the SFU never needs the frame contents.
room:
  empty_timeout: 30
  departure_timeout: 10
logging:
  level: warn
