# coturn baseline for Tessera call relays (docs/calling.md §5, ADR-016).
#
# The shared secret is NOT in this file: pass it at start-up from the secret store,
#   turnserver -c turnserver.conf --static-auth-secret="$TURN_SHARED_SECRET"
# and give the API the same value (TURN_SHARED_SECRET). Credentials are short-lived HMACs
# (coturn "TURN REST API" scheme); there are no static users.
#
# The relay must never become a path into our own network (TURN SSRF): relaying to private,
# loopback, link-local (cloud metadata), carrier-grade NAT, documentation, multicast and
# translated ranges is refused. Add the deployment's own VPC and public service ranges below.
# Verified by services/api/src/modules/calls/turn-relay.integration.test.ts.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=tessera
stale-nonce=600
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Per-user and total allocation quotas, and a per-session bandwidth cap (bytes/s): relay
# capacity is a resource attackers would otherwise take for free.
user-quota=12
total-quota=2400
max-bps=3000000
# Never write usernames or addresses to disk beyond the operational log level.
simple-log

# --- IPv4 ---
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# --- IPv6 ---
# Loopback. Do not list `::` or a range starting at `::` (e.g. ::-::ffff): coturn 4.6.1 then
# refuses every IPv4 peer. The unspecified address is checked by the IPv6 test instead.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
