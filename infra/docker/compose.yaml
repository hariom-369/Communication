# Local development dependencies only. Never used for staging/production (docs/deployment.md).
# Ports bind to 127.0.0.1 so the services are not reachable from the network.
#   docker compose -f infra/docker/compose.yaml up -d
name: tessera-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera-local-only
      POSTGRES_DB: tessera
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tessera -d tessera']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Captures all outgoing email locally; web UI at http://127.0.0.1:8025
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
