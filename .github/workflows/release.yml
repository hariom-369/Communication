name: Release

# A tag vX.Y.Z builds every artefact of the release once (docs/deployment.md §3, security review
# F-06): the signed web release, five container images with BuildKit SLSA provenance and SBOM
# attestations, a vulnerability scan that blocks the release, CycloneDX SBOMs, keyless Sigstore
# signatures (cosign, GitHub OIDC identity of this workflow), and the Kubernetes manifests of
# both environments rendered with the image digests. Deploying is a separate, approved step
# (deploy.yml). Tools are release binaries verified against their published checksums.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, scan, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Holds RELEASE_SIGNING_KEY; protected by required reviewers (ops/runbooks/release-signing-key.md).
    environment: release
    permissions:
      contents: write # the GitHub release
      packages: write # images in GHCR
      id-token: write # keyless signing
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      COSIGN_VERSION: 2.5.0
      SYFT_VERSION: 1.20.0
      TRIVY_VERSION: 0.61.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Release version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.-]+)?$ ]] || { echo "bad tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"
      - name: Rust toolchain (pinned in packages/crypto-core/rust-toolchain.toml) and wasm-bindgen
        working-directory: packages/crypto-core
        run: |
          rustup show active-toolchain
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - name: Build, with the web release signed by the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_NEXT_KEYS: ${{ vars.RELEASE_NEXT_KEYS }}
          RELEASE_REQUIRE_OFFICIAL: '1'
        run: pnpm build
      - run: pnpm test
      - name: Release manifest verifies (signature and every file)
        run: |
          pnpm --filter @tessera/web exec vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:4173/release.json > /dev/null && break; sleep 1; done
          node apps/web/scripts/verify-release.mjs http://localhost:4173

      - name: Tools (release binaries, checksums verified)
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -sSfL -o cosign-linux-amd64 "$base/cosign-linux-amd64"
          curl -sSfL -o cosign_checksums.txt "$base/cosign_checksums.txt"
          grep " cosign-linux-amd64\$" cosign_checksums.txt | sha256sum --check --strict
          install -m 0755 cosign-linux-amd64 "$bin/cosign"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o syft_checksums.txt "$base/syft_${SYFT_VERSION}_checksums.txt"
          grep " $archive\$" syft_checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin" syft
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o trivy_checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $archive\$" trivy_checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"

      - name: Registry login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push images (BuildKit SLSA provenance and SBOM attestations)
        env:
          VALUES_STAGING: ${{ vars.K8S_VALUES_STAGING }}
          VALUES_PRODUCTION: ${{ vars.K8S_VALUES_PRODUCTION }}
        run: |
          docker buildx create --use --driver docker-container --name release
          : > "$RUNNER_TEMP/digests.tsv"
          build() {
            local key="$1" image="$2" tag="$3"; shift 3
            docker buildx build --push --provenance=mode=max --sbom=true \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              --metadata-file "$RUNNER_TEMP/$key.json" -t "$REGISTRY/$image:$tag" "$@" .
            printf '%s\t%s\t%s\n' "$key" "$image" "$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$key.json")" >> "$RUNNER_TEMP/digests.tsv"
          }
          media_origin() { jq -r '"https://\(.mediaBucket).s3.\(.awsRegion).amazonaws.com"' <<< "$1"; }
          build api tessera-api "$VERSION" -f infra/images/api.Dockerfile
          build realtime tessera-realtime "$VERSION" -f infra/images/realtime.Dockerfile
          build adminWeb tessera-admin-web "$VERSION" -f infra/images/admin-web.Dockerfile
          # One signed web build; each environment's image names its own media origin in the CSP.
          build web-staging tessera-web "$VERSION-staging" -f infra/images/web.Dockerfile \
            --build-arg "MEDIA_ORIGIN=$(media_origin "$VALUES_STAGING")"
          build web-production tessera-web "$VERSION-production" -f infra/images/web.Dockerfile \
            --build-arg "MEDIA_ORIGIN=$(media_origin "$VALUES_PRODUCTION")"
          cat "$RUNNER_TEMP/digests.tsv"

      - name: Vulnerability scan (blocks the release on fixable HIGH or CRITICAL)
        run: |
          while IFS=$'\t' read -r _ image digest; do
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
              "$REGISTRY/$image@$digest"
          done < "$RUNNER_TEMP/digests.tsv"

      - name: SBOMs (CycloneDX), keyless signatures and SBOM attestations
        run: |
          mkdir -p "$RUNNER_TEMP/out/sbom"
          while IFS=$'\t' read -r key image digest; do
            ref="$REGISTRY/$image@$digest"
            syft "$ref" -o "cyclonedx-json=$RUNNER_TEMP/out/sbom/$key.cdx.json"
            cosign sign --yes "$ref"
            cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/out/sbom/$key.cdx.json" "$ref"
          done < "$RUNNER_TEMP/digests.tsv"
          cp "$RUNNER_TEMP/digests.tsv" "$RUNNER_TEMP/out/digests.tsv"

      - name: Render the manifests of both environments with the digests
        env:
          VALUES_STAGING: ${{ vars.K8S_VALUES_STAGING }}
          VALUES_PRODUCTION: ${{ vars.K8S_VALUES_PRODUCTION }}
        run: |
          digest() { awk -F '\t' -v k="$1" '$1 == k { print $3 }' "$RUNNER_TEMP/digests.tsv"; }
          for env in staging production; do
            if [ "$env" = staging ]; then values="$VALUES_STAGING"; else values="$VALUES_PRODUCTION"; fi
            jq --arg release "$VERSION" --arg api "$(digest api)" --arg realtime "$(digest realtime)" \
              --arg web "$(digest "web-$env")" --arg adminWeb "$(digest adminWeb)" \
              '. + { release: $release, images: { api: $api, realtime: $realtime, web: $web, adminWeb: $adminWeb } }' \
              <<< "$values" > "$RUNNER_TEMP/values-$env.json"
            pnpm --filter @tessera/k8s render --values "$RUNNER_TEMP/values-$env.json" --out "$RUNNER_TEMP/out"
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/web/dist/release.json apps/web/dist/release.json.sig "$RUNNER_TEMP/out/"
          (cd "$RUNNER_TEMP/out" && tar -czf sbom.tar.gz sbom && rm -r sbom)
          prerelease=""; [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tessera $VERSION" \
            --notes "Images by digest in digests.tsv; deploy with the Deploy workflow." $prerelease \
            "$RUNNER_TEMP"/out/*
