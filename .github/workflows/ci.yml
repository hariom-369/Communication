name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, build, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rust toolchain (pinned in packages/crypto-core/rust-toolchain.toml) and wasm-bindgen
        working-directory: packages/crypto-core
        run: |
          rustup show active-toolchain
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Crypto core lint (rustfmt, clippy native + wasm32)
        run: pnpm --filter @tessera/crypto-core lint
      - run: pnpm test
      - name: OpenAPI contract is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- services/api/openapi.json
      - name: Route security matrix is up to date
        run: |
          pnpm --filter @tessera/api security-matrix
          git diff --exit-code -- docs/security/route-matrix.md

  integration:
    name: Integration tests (PostgreSQL + Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera-ci-only
          POSTGRES_DB: tessera
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tessera:tessera-ci-only@localhost:5432/tessera
      TEST_VALKEY_URL: redis://localhost:6379
      TEST_S3_URL: http://127.0.0.1:29500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rust toolchain (pinned in packages/crypto-core/rust-toolchain.toml) and wasm-bindgen
        working-directory: packages/crypto-core
        run: |
          rustup show active-toolchain
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - name: S3-compatible test store (moto, pinned; docs/testing.md)
        run: |
          python3 -m pip install --user "moto[server]==5.2.3"
          nohup ~/.local/bin/moto_server -H 127.0.0.1 -p 29500 > moto.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:29500/ > /dev/null && break; sleep 1; done
      - name: coturn for the TURN relay-policy test (infra/calls/turnserver.conf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coturn
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Chromium, production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera-ci-only
          POSTGRES_DB: tessera
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tessera:tessera-ci-only@localhost:5432/tessera
      TEST_VALKEY_URL: redis://localhost:6379
      TEST_S3_URL: http://127.0.0.1:29500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Rust toolchain (pinned in packages/crypto-core/rust-toolchain.toml) and wasm-bindgen
        working-directory: packages/crypto-core
        run: |
          rustup show active-toolchain
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - name: S3-compatible test store (moto, pinned; docs/testing.md)
        run: |
          python3 -m pip install --user "moto[server]==5.2.3"
          nohup ~/.local/bin/moto_server -H 127.0.0.1 -p 29500 > moto.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:29500/ > /dev/null && break; sleep 1; done
      - name: Call infrastructure (coturn; LiveKit built from its pinned, checksum-verified Go module)
        env:
          LIVEKIT_VERSION: v1.13.9
          GOTOOLCHAIN: auto
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends coturn
          mkdir -p "$HOME/.local/bin" /tmp/livekit-build && cd /tmp/livekit-build
          printf 'module build\ngo 1.24\n' > go.mod
          dir=$(go mod download -json "github.com/livekit/livekit-server@${LIVEKIT_VERSION}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Dir"])')
          cp -r "$dir" src && chmod -R u+w src && cd src
          go build -o "$HOME/.local/bin/livekit-server" ./cmd/server
          "$HOME/.local/bin/livekit-server" --version
      - run: pnpm build
      - run: pnpm --filter @tessera/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tessera/web test:e2e
      - name: Admin console end to end (test identity provider, virtual security keys)
        run: pnpm --filter @tessera/admin test:e2e
      - name: Release manifest of the built app verifies (signature and every file)
        run: |
          pnpm --filter @tessera/web exec vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:4173/release.json > /dev/null && break; sleep 1; done
          node apps/web/scripts/verify-release.mjs http://localhost:4173

  deploy-config:
    name: Images, Kubernetes manifests, alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tessera/k8s... --filter @tessera/admin build
      - name: Render both environments and validate against the Kubernetes schemas
        run: |
          pip install kubernetes-validate==1.37.0 actionlint-py==1.7.12.25
          actionlint .github/workflows/*.yml
          for env in staging production; do
            pnpm --filter @tessera/k8s render --values "test-values/$env.json" --out "$RUNNER_TEMP/k8s"
            kubernetes-validate --strict "$RUNNER_TEMP/k8s/$env-1-prepare.yaml" "$RUNNER_TEMP/k8s/$env-2-workloads.yaml"
          done
      - name: Alert rules (promtool, release binary, checksum verified)
        env:
          PROMETHEUS_VERSION: 3.5.0
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o sha256sums.txt "$base/sha256sums.txt"
          grep " $archive\$" sha256sums.txt | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          ./promtool check rules infra/monitoring/alerts.yaml
      - name: Build the service images and run them read-only as non-root
        run: |
          docker build -f infra/images/api.Dockerfile -t tessera-api:ci .
          docker build -f infra/images/realtime.Dockerfile -t tessera-realtime:ci .
          docker build -f infra/images/admin-web.Dockerfile -t tessera-admin-web:ci .
          # The isolated fetcher needs no dependencies, so it proves the API image boots.
          docker run -d --name fetcher --read-only --user 65532:65532 --cap-drop ALL \
            -e FETCHER_TOKEN="$(openssl rand -hex 32)" -p 9090:9090 tessera-api:ci dist/fetcher-server.js
          docker run -d --name admin-web --read-only --tmpfs /tmp --user 65532:65532 --cap-drop ALL \
            -p 8081:8081 -p 8080:8080 tessera-admin-web:ci
          for url in http://127.0.0.1:9090/readyz http://127.0.0.1:8081/readyz; do
            for _ in $(seq 1 30); do curl -sf "$url" && break; sleep 1; done
            curl -sf "$url"
          done
          curl -sfI http://127.0.0.1:8080/ | grep -i '^content-security-policy:'
          docker run --rm --entrypoint /nodejs/bin/node tessera-realtime:ci -e "import('/app/dist/config.js').then(() => process.exit(0))"

  rust-supply-chain:
    name: Crypto core dependencies (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo deny (advisories, licenses, bans, sources; packages/crypto-core/deny.toml)
        working-directory: packages/crypto-core
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --locked check

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (release binary, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=packages/crypto-core/Cargo.lock

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
