version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images of infra/images (pinned by version; the release records the resolved digests).
  - package-ecosystem: docker
    directory: /infra/images
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /packages/crypto-core
    schedule:
      interval: weekly
